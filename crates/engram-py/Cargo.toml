[package]
name = "engram-py"
description = "Python bindings for Engram (PyO3) — builds the `engram` wheel via maturin."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "engram"
# cdylib for the Python wheel; rlib so the default workspace build/clippy/test
# can still treat it as a normal crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
engram-core = { workspace = true }
engram-query = { workspace = true }
# PyO3 is opt-in (the `python` feature). The default workspace gate builds this
# crate WITHOUT it, so `cargo build/test --workspace` needs no libpython; maturin
# builds the wheel with `--features python`.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"], optional = true }

[features]
python = ["dep:pyo3"]
