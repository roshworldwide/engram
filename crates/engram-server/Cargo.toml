[package]
name = "engram-server"
description = "Engram network surfaces: REST (axum) and gRPC (tonic) front-ends over the query engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
engram-core = { workspace = true }
engram-storage = { workspace = true }
engram-query = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = "1"
anyhow = { workspace = true }
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }

[build-dependencies]
tonic-build = { workspace = true }

[features]
# gRPC is opt-in: it needs `protoc` at build time, so the default build (and CI
# without protoc) stays protoc-free. Build with `--features grpc`.
grpc = ["dep:tonic", "dep:prost"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = { workspace = true }
tokio = { workspace = true }

[[bin]]
name = "engram-server"
path = "src/main.rs"
