# cargo-deny configuration — supply-chain gate (Q6).
# Run with: cargo deny check   (or `cargo xtask ci`, which invokes it when present)

[graph]
all-features = true

[advisories]
# Fail the build on any known security advisory for a dependency in the tree.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Engram is dual-licensed MIT OR Apache-2.0; only permit compatible licenses.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "warn"
# Hard guardrail (R1): embedding a third-party storage/database engine is
# forbidden. cargo-deny refuses these crates so the rule cannot regress silently.
deny = [
    { name = "rocksdb" },
    { name = "librocksdb-sys" },
    { name = "lmdb" },
    { name = "lmdb-rkv" },
    { name = "rusqlite" },
    { name = "libsqlite3-sys" },
    { name = "sled" },
    { name = "redb" },
    { name = "heed" },
    { name = "persy" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
